<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0D0C10}
a{color:#F4EDE1}a:hover{color:var(--g1)}
.ajrak{background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.10) 2px,transparent 3px),repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 1px,transparent 1px 22px);background-size:31px 31px,auto,auto}
input:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 4px rgba(217,168,78,.18)}
h1,h2,h3,b[style*="Cormorant"]{font-weight:600!important;letter-spacing:-0.015em!important}
h1 em,h2 em{font-weight:500}
.logo{width:24px!important;height:30px!important;overflow:visible;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.logo-arch{stroke-dasharray:260;stroke-dashoffset:260;animation:logo-draw 1.8s cubic-bezier(.22,1,.36,1) .2s forwards}
.logo-dot{animation:logo-glow 2.6s ease-in-out infinite}
a:hover > .logo{transform:translateY(-3px) scale(1.06)}
@keyframes logo-draw{to{stroke-dashoffset:0}}
@keyframes logo-glow{0%,100%{opacity:.5}50%{opacity:1}}
/* hover everywhere */
main a:not([style*="999px"]){position:relative;text-decoration:none;transition:color .3s}
main a:not([style*="999px"]):not(:first-child)::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1.5px;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:transform .4s cubic-bezier(.22,1,.36,1)}
main a:not([style*="999px"]):hover::after{transform:scaleX(1);transform-origin:left}
input:hover{border-color:#6F6778!important}
aside > article{transition:box-shadow .5s}aside > article:hover{box-shadow:0 0 0 1px var(--accent),0 50px 100px -40px rgba(217,168,78,.4)!important}
.art{opacity:.3!important;top:20px!important;right:20px!important;bottom:auto!important;width:100px!important;height:100px!important}
.art.lg{top:0!important;right:40px!important;width:220px!important;height:220px!important}
.ajrak h2,.ajrak b,.ajrak span{text-shadow:none}
/* filled lanterns in the panel, straight card with the mehrab scene */
.old-art{display:none}
.scene{position:absolute!important;z-index:0!important;pointer-events:none}
.panel-scene{top:0;right:28px;left:auto;width:min(300px,44%);height:min(300px,44%)}
.card-scene{right:-6px;top:0;width:48%;height:100%;-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent);mask-image:linear-gradient(to bottom,#000 70%,transparent)}
.sc-lamp{animation:sc-sway 4.2s ease-in-out infinite}
.sc-lamp.l2{animation-duration:5.2s;animation-delay:.6s}
.sc-lamp.l3{animation-duration:3.6s;animation-delay:1.2s}
.sc-flame{transform-box:fill-box;transform-origin:center;animation:sc-flick 1.4s ease-in-out infinite alternate}
.sc-moon{transform-box:fill-box;transform-origin:center;animation:a-pulse 6s ease-in-out infinite}
.sc-star{transform-box:fill-box;transform-origin:center;animation:a-tw 2.6s ease-in-out infinite}.sc-star.s2{animation-delay:1.3s}
.sc-toran{animation:sc-sway 5s ease-in-out infinite;transform-origin:150px 0}
.sc-bloom{animation:sc-spin 40s linear infinite}
@keyframes sc-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sc-flick{from{opacity:.55;transform:scale(.9)}to{opacity:1;transform:scale(1.15)}}
@keyframes sc-spin{to{transform:rotate(360deg)}}
@keyframes a-float2{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
aside{justify-content:space-between!important;gap:32px!important}
aside > h2{max-width:8ch!important}
aside > article{animation:a-float2 6s ease-in-out infinite!important;width:360px!important}
aside > article .ajrak{min-height:150px!important;padding:22px!important}
/* responsive */
main{padding:clamp(24px,4vw,44px) clamp(20px,7vw,112px)!important;gap:40px}
h1{font-size:clamp(42px,4.4vw,62px)!important;line-height:1!important}
aside h2{font-size:clamp(44px,5vw,72px)!important}
form a[style*="999px"]{height:48px!important;font-size:15px!important}
input{height:50px!important}
span[style*="text-transform: uppercase"]{font-size:12px!important}
aside{padding:clamp(28px,4.4vw,64px)!important;min-height:460px;gap:36px}
@media (max-width:960px){
  aside{order:-1;margin:12px!important;min-height:300px}
  aside > article{display:none}
  aside > .art{display:none!important}
  aside{min-height:0!important}
  main > div:first-child{flex-wrap:wrap;gap:8px}
  main{min-height:auto}
}
input{transition:border-color .25s,box-shadow .25s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes drift{to{background-position:62px 62px,44px 0,0 44px}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(-1deg)}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
form > *{animation:rise .9s cubic-bezier(.22,1,.36,1) both}
form > *:nth-child(2){animation-delay:.1s}form > *:nth-child(3){animation-delay:.18s}form > *:nth-child(4){animation-delay:.26s}form > *:nth-child(5){animation-delay:.34s}

.ajrak{animation:drift 40s linear infinite}
aside > article{animation:float 6s ease-in-out infinite}
h1 em,h2 em{background:linear-gradient(90deg,var(--g1) 0%,var(--g2) 50%,var(--g1) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 5s linear infinite}
a[style*="999px"]{transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,background-color .25s}
a[style*="999px"]:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(217,168,78,.6)}
a[style*="999px"]{position:relative;overflow:hidden;isolation:isolate}
a[style*="999px"]::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s cubic-bezier(.22,1,.36,1);pointer-events:none}
a[style*="999px"]:hover::before{transform:translateX(120%)}
.ajrak{position:relative;overflow:hidden;background-image:none!important}
.ajrak > *:not(.art){position:relative;z-index:1}
.art{position:absolute;z-index:0;right:-20px;bottom:-30px;width:200px;height:200px;color:rgba(255,255,255,.6);pointer-events:none;opacity:.5}
.art.lg{width:440px;height:440px;right:-60px;top:-40px;bottom:auto;opacity:.4}
.art .spin{transform-origin:100px 100px;animation:a-spin 50s linear infinite}
.art .sway{transform-box:fill-box;transform-origin:50% 0;animation:a-sway 4s ease-in-out infinite}
.art .pulse{transform-box:fill-box;transform-origin:center;animation:a-pulse 4s ease-in-out infinite}
.art .tw{transform-box:fill-box;transform-origin:center;animation:a-tw 2.6s ease-in-out infinite}
.art .d2{animation-delay:.8s}.art .d3{animation-delay:1.6s}
@keyframes a-spin{to{transform:rotate(360deg)}}
@keyframes a-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes a-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes a-tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.5);opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* fit any screen: on desktop the page is exactly one screen tall */
@media (min-width:961px){
  x-dc > div,body > div{height:100vh;min-height:0!important;overflow:hidden}
  main{padding:clamp(18px,4vh,44px) clamp(28px,7vw,112px)!important;min-height:0!important;gap:clamp(8px,2vh,20px)}
  main form{gap:clamp(8px,1.8vh,18px)!important}
  main form h1{font-size:clamp(28px,min(3.6vw,7vh),60px)!important}
  main form > div:first-child{gap:clamp(4px,1vh,12px)!important}
  aside{margin:clamp(10px,2vh,18px)!important;padding:clamp(20px,5vh,56px) clamp(24px,3.6vw,56px)!important;min-height:0!important;gap:clamp(10px,2vh,24px)!important;overflow:hidden}
  aside > h2{font-size:clamp(36px,min(5.6vw,11vh),88px)!important}
  aside > article{width:clamp(240px,min(26vw,48vh),380px)!important;flex:none}
  aside > article > .ajrak{min-height:clamp(90px,17vh,150px)!important;padding:clamp(14px,2.6vh,26px)!important}
  aside > article b{font-size:clamp(24px,min(2.4vw,5vh),38px)!important}
  aside > article > div:last-child{padding:clamp(8px,1.6vh,16px) clamp(14px,1.8vw,24px)!important;font-size:13px!important}
  .panel-scene{width:clamp(160px,22vw,300px)!important;height:auto!important}
}
/* fit short screens */
@media (min-width:900px){ h1{font-size:clamp(32px,min(4vw,7.5vh),60px)!important} h2{font-size:clamp(34px,min(4.4vw,9vh),72px)!important} input{height:clamp(40px,6.4vh,52px)!important} button[type="submit"],form button{height:clamp(40px,6.4vh,48px)!important} form{gap:clamp(10px,2vh,18px)!important} }
</style>
